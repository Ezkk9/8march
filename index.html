<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Для мами ❤️</title>

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
font-family:Arial;
overflow:hidden;
background:url("IMG_4493.jpeg") center/cover no-repeat;
}

.container{
z-index:2;
position:relative;
max-width:700px;
}

h1{
color:white;
font-size:44px;
margin-bottom:20px;
}

.textbox{
background:rgba(0,0,0,0.45);
padding:20px;
border-radius:18px;
display:inline-block;
}

p{
color:white;
font-size:24px;
margin:10px 0;
}

button{
padding:16px 34px;
font-size:20px;
border:none;
border-radius:12px;
background:white;
color:black;
cursor:pointer;
margin-top:20px;
}

img{
width:420px;
border-radius:25px;
margin-top:20px;
display:none;
}

.emoji{
position:absolute;
z-index:1;
opacity:0.55;
animation:fall linear forwards;
}

@keyframes fall{
0%{
transform:translateY(-120px);
}
100%{
transform:translateY(110vh);
}
}

</style>
</head>

<body>

<div class="container">

<h1 id="title">Вітаю тебе з 8 березня!</h1>

<img id="photo1" src="IMG_4491.jpeg">
<img id="photo2" src="IMG_4492.jpeg">

<div class="textbox">
<p id="text"></p>
</div>

<button id="btn" onclick="next()">Далі</button>

</div>

<script>

let step=0;

function next(){

step++;

if(step===1){

document.getElementById("title").innerText="Дякую тобі..";

document.getElementById("photo1").style.display="block";

document.getElementById("text").innerText=
"Дякую що ти в мене така чудова мама, що завжди підтримуєш мене, оберігаєш та допомагаєш. Ти сама чудова мама в світі";

}

else if(step===2){

document.getElementById("photo1").style.display="none";
document.getElementById("text").innerText="";

document.getElementById("photo2").style.display="block";

document.getElementById("title").innerText="Люблю тебе ❤️";

document.getElementById("btn").style.display="none";

}

}

function createEmoji(){

let el=document.createElement("div");

el.className="emoji";

let arr=["❤️","🌸","🌺","🌷","💮"];

el.innerText=arr[Math.floor(Math.random()*arr.length)];

el.style.left=Math.random()*100+"vw";

el.style.fontSize=(Math.random()*25+30)+"px";

el.style.animationDuration=(Math.random()*10+10)+"s";

document.body.appendChild(el);

setTimeout(()=>{el.remove()},20000);

}

setInterval(createEmoji,900);

</script>

</body>
</html>
