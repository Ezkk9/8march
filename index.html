<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Для мами ❤️</title>

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
font-family:Arial;
overflow:hidden;
background:url("IMG_4493.jpeg") center/cover no-repeat;
}

.container{
background:rgba(0,0,0,0.45);
padding:40px;
border-radius:20px;
z-index:2;
position:relative;
max-width:600px;
}

h1{
color:white;
font-size:42px;
margin-bottom:20px;
}

p{
color:white;
font-size:22px;
}

button{
padding:15px 30px;
font-size:20px;
border:none;
border-radius:12px;
background:white;
color:black;
cursor:pointer;
margin-top:20px;
}

img{
width:300px;
border-radius:20px;
margin-top:20px;
opacity:0;
transition:opacity 2s;
}

.show{
opacity:1;
}

.emoji{
position:absolute;
z-index:1;
opacity:0.35;
animation:fall linear forwards;
}

@keyframes fall{
0%{
transform:translateY(-100px);
}
100%{
transform:translateY(110vh);
}
}

</style>
</head>

<body>

<div class="container">

<h1 id="title">Вітаю тебе з 8 березня!</h1>

<img id="photo1" src="IMG_4491.jpeg">
<img id="photo2" src="IMG_4492.jpeg">

<p id="text"></p>

<button id="btn" onclick="next()">Далі</button>

</div>

<script>

let step=0;

function next(){

step++;

if(step===1){

document.getElementById("title").innerText="Дякую тобі..";

setTimeout(()=>{
document.getElementById("photo1").classList.add("show");
},3000);

document.getElementById("text").innerText=
"Дякую що ти в мене така чудова мама, що завжди підтримуєш мене, оберігаєш та допомагаєш. Ти сама чудова мама в світі";

}

else if(step===2){

document.getElementById("photo2").classList.add("show");

document.getElementById("btn").style.display="none";

document.getElementById("text").innerText="Люблю тебе ❤️";

}

}

function createEmoji(){

let el=document.createElement("div");

el.className="emoji";

let arr=["❤️","🌸","🌺","💮","🌷"];

el.innerText=arr[Math.floor(Math.random()*arr.length)];

el.style.left=Math.random()*100+"vw";

el.style.fontSize=(Math.random()*20+20)+"px";

el.style.animationDuration=(Math.random()*6+8)+"s";

document.body.appendChild(el);

setTimeout(()=>{el.remove()},12000);

}

setInterval(createEmoji,800);

</script>

</body>
</html>
